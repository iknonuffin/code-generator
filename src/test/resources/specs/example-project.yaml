project:
  name: marketplace
  basePackage: com.github.iknonuffin.marketplace

generator:
  generateControllers: false
  generateServices: false
  generateRepositories: false
  generateDtos: false
  generateEvents: false

services:

  - name: order-service

    packageName: order

    enums:
      - name: OrderStatus
        values:
          - CREATED
          - CONFIRMED
          - CANCELLED
          - COMPLETED

    entities:
      - name: Order

        fields:
          id: Long
          userId: Long
          status: OrderStatus
          total: BigDecimal

  - name: product-service

    packageName: product

    entities:
      - name: Product

        fields:
          id: Long
          name: String
          price: BigDecimal

  - name: user-service

    packageName: user

    entities:
      - name: User

        fields:
          id: Long
          username: String
          password: String

        overrides:
          service:
            name: OrderManagementService